function valueOf(item, keys) { for (const key of keys) if (item && item[key] !== undefined && item[key] !== null && item[key] !== '') return item[key]; return ''; }
function listFiltered() {
  const needle = $('search').value.trim().toLocaleLowerCase();

}
function renderFilters() {

function renderList() {
  renderFilters();

    const num = item.defectNumber ?? '';

      <span class="itemTop"><span class="num">${esc(num)}</span>${item.severityName ? `<span class="sev" data-level="${esc(item.severityName)}">${esc(item.severityName)}</span>` : ''}</span>

function badge(text, level) { return `<span class="sev" data-level="${esc(level ?? text)}">${esc(text)}</span>`; }
function fields(pairs) {
  const rows = pairs.filter(([, value]) => value !== undefined && value !== null && value !== '').map(([label, value]) => `<div class="field"><dt>${esc(label)}</dt><dd>${esc(value)}</dd></div>`);

}
function renderDetail() {
  const d = state.detail;

    <div class="actions"><button type="button" class="primary" id="askAi" data-num="${esc(d.defectNumber ?? '')}">让 AI 分析</button></div></div>
    <section class="card"><h3>基本信息</h3><div class="cardBody">${fields([
      ['缺陷类型', d.categoryName], ['测试类型', d.testTypeName], ['复现概率', d.probabilityName], ['测试领域', d.fieldName],
      ['项目编号', d.projectNumber], ['产品线', d.projectLineName], ['问题版本', d.issueVerName], ['需求编号', d.wermId],
      ['测试任务', d.testNumberName], ['关联用例', d.useCaseNum], ['自动化用例', d.automaticUseCaseNum],
      ['创建人', d.creatorName], ['创建时间', d.createTime], ['提单时间', d.submitTime],
    ])}</div></section>
    <section class="card"><h3>详细描述</h3><div class="cardBody desc">${description || '<span class="muted">暂无</span>'}</div></section>
    ${images.length ? `<section class="card"><h3>内嵌图片</h3><div class="cardBody files">${images.map(path => `<div class="fileRow"><code>${esc(path)}</code></div>`).join('')}</div></section>` : ''}
    ${files.length ? `<section class="card"><h3>附件</h3><div class="cardBody files">${files.map(file => `<div class="fileRow"><code>${esc(file.fileName ?? '')}</code>${file.path ? `<span>${esc(file.path)}</span>` : ''}${file.error ? `<span style="color:var(--bad)">${esc(file.error)}</span>` : ''}${file.size ? `<span>${formatSize(file.size)}</span>` : ''}</div>`).join('')}</div></section>` : ''}
    ${extra.length ? `<section class="card"><h3>其他信息</h3><div class="cardBody">${fields(extra.map(([key, value]) => [key, typeof value === 'object' ? JSON.stringify(value) : String(value)]))}</div></section>` : ''}`;
}
function renderNodes(nodes, depth) {
  if (!Array.isArray(nodes) || nodes.length === 0) return '';
  return `<ul class="tree">${nodes.map(node => `<li class="node"><details ${depth < 2 ? 'open' : ''}><summary>${esc(node.title)}</summary><div class="nodeBody">
    ${node.detail ? `<div class="nodeDetail">${esc(node.detail)}</div>` : ''}
    ${Array.isArray(node.items) && node.items.length ? `<ul class="nodeItems">${node.items.map(item => `<li>${esc(item)}</li>`).join('')}</ul>` : ''}
    ${node.children && node.children.length ? `<div class="children">${renderNodes(node.children, depth + 1)}</div>` : ''}
  </div></details></li>`).join('')}</ul>`;
}
function renderReport() {
  const r = state.report;
  if (!r) return '<div class="empty"><strong>还没有分析报告</strong><span>选择缺陷后点“让 AI 分析”，模型会阅读代码并调用 wetrack_report 生成层级报告</span></div>';
  return `<div class="reportHead"><div class="num">${esc(r.defectNumber ?? '')}</div><h2>${esc(r.title ?? '分析报告')}</h2><div class="sub">${esc(r.generatedAt ?? '')}</div></div>
    <div class="conclusion">${esc(r.conclusion ?? '')}</div>
    <div style="margin-top:12px">${renderNodes(r.sections, 0)}</div>`;
}
function render() {
  $('tabBoard').setAttribute('aria-selected', String(state.view === 'board'));
  $('tabNew').setAttribute('aria-selected', String(state.view === 'new'));
  $('tabReport').setAttribute('aria-selected', String(state.view === 'report'));
  document.querySelector('.list').style.display = state.view === 'board' ? '' : 'none';
  document.querySelector('.layout').style.gridTemplateColumns = state.view === 'board' ? '' : '1fr';
  const banner = state.error ? `<div class="banner" role="alert">${esc(state.error)}</div>` : '';
  const loading = state.loading ? '<div class="loading"><span class="spinner"></span>读取中…</div>' : '';
  if (state.view === 'new') {
    renderNewView();
  } else {
    mainEl.innerHTML = banner + loading + (state.view === 'board' ? renderDetail() : renderReport());
    const ask = $('askAi');
    if (ask) ask.onclick = () => askAi(ask.dataset.num);
  }
  renderList();
  setSub(state.list ? `${state.list.count ?? state.list.items?.length ?? 0} 条待办 · ${state.list.generatedAt ?? ''}` : '正在连接…');
  if (state.view === 'report') mainEl.scrollTop = 0;
}
function applyToolResult(result) {
  const content = result?.structuredContent ?? result?.result?.structuredContent;
  if (!content) return;
  if (content.kind === 'pending') { state.list = content; state.loading = false; state.error = ''; if (state.selected && !(content.items ?? []).some(item => item.defectNumber === state.selected)) state.selected = null; render(); return; }
  if (content.kind === 'detail') { state.detail = content; state.selected = content.defectNumber ?? state.selected; state.loading = false; state.error = ''; render(); return; }
  if (content.kind === 'report') { state.report = content; state.view = 'report'; state.loading = false; state.error = ''; render(); return; }
}
async function callTool(name, args) {
  state.loading = true; state.error = ''; render();

    const result = await rpc('tools/call', { name, arguments: args });
    if (result?.isError) { state.loading = false; state.error = result.content?.[0]?.text ?? '工具执行失败'; render(); return null; }
    state.loading = false;
    applyToolResult(result);

async function loadPending() { await callTool('wetrack_pending', {}); }

}
async function askAi(defectNumber) {

    setSub('已把分析请求发给 AI');

}
$('refresh').onclick = () => { if (demo) { state.list = DEMO.pending; state.loading = false; state.error = ''; render(); } else loadPending(); };
$('search').oninput = renderList;
$('severity').onchange = renderList;
$('status').onchange = renderList;
$('tabBoard').onclick = () => { state.view = 'board'; render(); };
$('tabNew').onclick = () => { state.view = 'new'; render(); };
$('tabReport').onclick = () => { state.view = 'report'; render(); };
addEventListener('message', event => {
  const m = event.data;
  if (!m || m.jsonrpc !== '2.0') return;
  if (m.method === 'ui/initialize') { parent.postMessage({ jsonrpc: '2.0', method: 'ui/initialized' }, '*'); if (demo) { state.list = DEMO.pending; state.detail = DEMO.detail; state.report = DEMO.report; state.selected = DEMO.detail.defectNumber; render(); } else loadPending(); return; }

if (demo) { state.list = DEMO.pending; state.detail = DEMO.detail; state.report = DEMO.report; state.selected = DEMO.detail.defectNumber; render(); }
else { render(); setTimeout(() => { if (state.list === null && !state.loading) { state.error = '还没有收到 Host 的桥接握手。若直接打开此页面，请加 ?demo=1；在 pi-web 插件卡中打开则无需处理。'; render(); } }, 1500); }
